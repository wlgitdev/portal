<span class="chip" [class]="variant()">
  @switch (variant()) {
    @case ('shipped') {
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M3 8.5l3 3 7-7"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
    @case ('awaiting') {
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" />
        <path
          d="M8 4.5v4l2.5 1.5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    }
    @case ('late') {
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 1.5l7 12.5H1z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          d="M8 6.5v3.2M8 11.6v.1"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    }
  }
  {{ status() }}
</span>
