<app-page-header title="Account" />

@if (form(); as value) {
  <form class="account-form" (ngSubmit)="save()">
    <app-form-field label="Company name" [value]="value.companyName" [readonlyField]="true" />

    <section class="section">
      <h2>Contact</h2>
      <app-form-field
        label="Contact name"
        [value]="value.contactName"
        [error]="errors().contactName"
        (valueChange)="updateField('contactName', $event)"
      />
    </section>

    <section class="section">
      <h2>Address</h2>
      <app-form-field
        label="Address"
        [value]="value.address"
        [error]="errors().address"
        (valueChange)="updateField('address', $event)"
      />
      <div class="field-pair">
        <app-form-field
          label="City"
          [value]="value.city"
          [error]="errors().city"
          (valueChange)="updateField('city', $event)"
        />
        <app-form-field
          label="Region"
          [value]="value.region"
          [error]="errors().region"
          (valueChange)="updateField('region', $event)"
        />
      </div>
      <div class="field-pair">
        <app-form-field
          label="Postal code"
          [value]="value.postalCode"
          [error]="errors().postalCode"
          (valueChange)="updateField('postalCode', $event)"
        />
        <app-form-field
          label="Country"
          [value]="value.country"
          [error]="errors().country"
          (valueChange)="updateField('country', $event)"
        />
      </div>
    </section>

    <section class="section">
      <h2>Phone</h2>
      <div class="field-pair">
        <app-form-field
          label="Phone"
          type="tel"
          [value]="value.phone"
          [error]="errors().phone"
          (valueChange)="updateField('phone', $event)"
        />
        <app-form-field
          label="Fax"
          type="tel"
          [value]="value.fax"
          [error]="errors().fax"
          (valueChange)="updateField('fax', $event)"
        />
      </div>
    </section>

    <div class="actions">
      <button type="submit" [disabled]="saving()">Save changes</button>
    </div>
  </form>
} @else {
  <p class="loading">Loading your details…</p>
}
