<h2 mat-dialog-title>Discard unsaved changes?</h2>
<mat-dialog-content
  >You have changes to your account details that haven't been saved yet.</mat-dialog-content
>
<mat-dialog-actions>
  <button type="button" class="keep-editing" (click)="keepEditing()">Keep editing</button>
  <button type="button" class="discard" (click)="discard()">Discard changes</button>
</mat-dialog-actions>
