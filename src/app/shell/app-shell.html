<div class="shell">
  <nav class="side-rail" aria-label="Primary">
    <span class="wordmark">NW</span>
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">
        <app-nav-icon [name]="item.icon" />
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="main">
    <header class="top-bar">
      <span class="wordmark top-wordmark">Northwind</span>
      @if (session.customerId(); as customerId) {
        <div class="session">
          <span class="signed-in-as">Signed in as {{ customerId }}</span>
          <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
        </div>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">
          <app-nav-icon [name]="item.icon" />
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
</div>
