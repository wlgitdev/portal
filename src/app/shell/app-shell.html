<div class="shell">
  <nav class="side-rail" aria-label="Primary">
    <span class="wordmark">NW</span>
    @for (item of navItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active">
        <app-nav-icon [name]="item.icon" />
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="main">
    <header class="top-bar" role="banner">
      <span class="wordmark top-wordmark">Northwind</span>
      @if (session.customerId()) {
        @if (viewport.isPhone()) {
          <button
            type="button"
            class="account-trigger phone"
            [attr.aria-label]="'Account: ' + currentCustomer().companyName"
            aria-haspopup="menu"
            [attr.aria-expanded]="accountSheetOpen()"
            (click)="openAccountSheet()"
          >
            <app-monogram [customer]="currentCustomer()" [size]="32" />
          </button>
        } @else {
          <button
            type="button"
            class="account-trigger"
            [class.open]="accountTrigger.isOpen()"
            #accountTrigger="cdkMenuTriggerFor"
            [cdkMenuTriggerFor]="accountMenuTpl"
            [cdkMenuPosition]="accountMenuPositions"
            [attr.aria-label]="'Account: ' + currentCustomer().companyName"
            aria-haspopup="menu"
            [attr.aria-expanded]="accountTrigger.isOpen()"
          >
            <app-monogram [customer]="currentCustomer()" [size]="32" />
            <span class="account-name">{{ currentCustomer().companyName }}</span>
            <app-icon name="chevron-down" [size]="14" class="chevron" />
          </button>
          <ng-template #accountMenuTpl>
            <div class="account-menu-popover popover-surface" data-testid="popover-surface">
              <app-account-menu />
            </div>
          </ng-template>
        }
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">
          <app-nav-icon [name]="item.icon" />
          <span class="label">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
</div>
